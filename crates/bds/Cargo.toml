[package]
name = "beacon-bds"
description = "Beacon in-game smoke test: runs a built .mcworld on a hash-pinned Bedrock Dedicated Server (8.5)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "beacon-bds"
path = "src/main.rs"

[dependencies]
beacon-fetch = { path = "../fetch" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
