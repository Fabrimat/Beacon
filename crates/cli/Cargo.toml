[package]
name = "beacon-cli"
description = "Beacon CLI"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "beacon"
path = "src/main.rs"

[dependencies]
beacon-engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
notify = "8"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
