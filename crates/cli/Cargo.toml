[package]
name = "beacon-cli"
description = "Beacon CLI"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "beacon"
path = "src/main.rs"

[dependencies]
beacon-engine = { path = "../engine" }
beacon-jshost = { path = "../jshost" }
beacon-bundler = { path = "../bundler" }
beacon-serve = { path = "../serve" }
beacon-api = { path = "../api" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
