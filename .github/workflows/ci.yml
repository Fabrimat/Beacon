name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned by rust-toolchain.toml (rustup honours it).
      - uses: Swatinem/rust-cache@v2

      # The platform-native esbuild binary (never an npm shim); beacon finds it via BEACON_ESBUILD.
      - name: Install esbuild
        shell: bash
        run: |
          npm i --prefix .ci-esbuild esbuild@0.28.2
          arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo arm64 || echo x64)
          case "$RUNNER_OS" in
            Windows) p=win32-$arch/esbuild.exe ;;
            macOS) p=darwin-$arch/bin/esbuild ;;
          esac
          echo "BEACON_ESBUILD=$(pwd -W 2>/dev/null || pwd)/.ci-esbuild/node_modules/@esbuild/$p" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Corpus (large)
        run: cargo corpus --size large --out .ci-corpus-large

      - name: Build beacon
        run: cargo build --release -p beacon-cli

      - name: Spike
        run: cargo spike

      # Enforces every phase-1 and phase-4 (serve idle) budget in perf/budgets.json.
      - name: Perf (enforced, phase 1 + serve idle)
        shell: bash
        run: >-
          cargo perf run
          --beacon target/release/beacon${{ runner.os == 'Windows' && '.exe' || '' }}
          --project .ci-corpus-large
          --runs 20
          --idle-secs 5
          --enforce
          --phase 4
          --json perf-${{ runner.os }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ runner.os }}
          path: |
            perf-*.json
            docs/spikes/quickjs.md

  # Same fixture, same flags, on every OS: the .mcaddon must be byte-identical
  # (.gitattributes forces LF, so source bytes match).
  determinism:
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install esbuild
        shell: bash
        run: |
          npm i --prefix .ci-esbuild esbuild@0.28.2
          arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo arm64 || echo x64)
          case "$RUNNER_OS" in
            Windows) p=win32-$arch/esbuild.exe ;;
            macOS) p=darwin-$arch/bin/esbuild ;;
          esac
          echo "BEACON_ESBUILD=$(pwd -W 2>/dev/null || pwd)/.ci-esbuild/node_modules/@esbuild/$p" >> "$GITHUB_ENV"

      - name: Build beacon
        run: cargo build --release -p beacon-cli

      - name: Build fixtures/minimal as .mcaddon and hash it
        shell: bash
        run: |
          target/release/beacon${{ runner.os == 'Windows' && '.exe' || '' }} build \
            --project fixtures/minimal --target addon --trust --out det-out
          python - <<'PY'
          import glob, hashlib, zipfile
          fs = glob.glob("det-out/**/*.mcaddon", recursive=True)
          if len(fs) != 1:
              raise SystemExit(f"expected exactly one .mcaddon under det-out, found {fs}")
          f = fs[0]
          out = ["archive " + hashlib.sha256(open(f, "rb").read()).hexdigest()]
          with zipfile.ZipFile(f) as z:
              out += sorted(f"{n} {hashlib.sha256(z.read(n)).hexdigest()}" for n in z.namelist())
          open("determinism.txt", "wb").write(("\n".join(out) + "\n").encode())
          PY
          cat determinism.txt

      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ runner.os }}
          path: determinism.txt

  determinism-compare:
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
      - name: Compare
        run: |
          ls -R .
          diff --strip-trailing-cr determinism-Windows/determinism.txt determinism-macOS/determinism.txt

  # In-game smoke on a real Bedrock Dedicated Server (8.5). The repo owner accepted the Minecraft
  # EULA (https://minecraft.net/eula) for automated BDS use on 2026-10-16; `--accept-eula` below
  # records that acceptance in <tools>/bds-eula.log on every run. The BDS zip is downloaded only
  # from minecraft.net, blake3-pinned in crates/bds, cached here by hash, never redistributed.
  bds-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BEACON_HOME: ${{ github.workspace }}/.beacon-home
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: .beacon-home/tools/03d640d7268fca93be29a1f27c5094f76188e9df68a0bb70f62184c9841840d9
          key: bds-win-03d640d7268fca93be29a1f27c5094f76188e9df68a0bb70f62184c9841840d9

      - name: Install esbuild
        shell: bash
        run: |
          npm i --prefix .ci-esbuild esbuild@0.28.2
          echo "BEACON_ESBUILD=$(pwd -W)/.ci-esbuild/node_modules/@esbuild/win32-x64/esbuild.exe" >> "$GITHUB_ENV"

      - name: Build beacon
        run: cargo build --release -p beacon-cli

      # fixtures/minimal has no world target, so multipack's `world` target is used. Fixtures
      # target a released game version (<= the pinned BDS), so packs load as-is.
      - name: Build the multipack world
        shell: bash
        run: |
          cp -r fixtures/multipack "$RUNNER_TEMP/multipack"
          target/release/beacon.exe build --project "$RUNNER_TEMP/multipack" --target world --trust --out smoke-out

      - name: BDS smoke
        run: >-
          cargo bds smoke
          --world smoke-out/beacon-multipack-world.mcworld
          --expect BEACON_SMOKE_OK:2
          --accept-eula --yes
          --log bds-smoke.log

      # Script debugger interop (6.6): BDS listens on 19144 and the game speaks first.
      - name: BDS debug-listen smoke
        timeout-minutes: 5
        run: >-
          cargo bds debug-listen
          --world smoke-out/beacon-multipack-world.mcworld
          --accept-eula --yes
          --log bds-debug-listen.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bds-smoke-log
          path: |
            bds-smoke.log
            bds-debug-listen.log
            .beacon-home/tools/bds-eula.log
