name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned by rust-toolchain.toml (rustup honours it).
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Corpus (medium)
        run: cargo corpus --size medium --out target/corpus-medium

      - name: Build beacon
        run: cargo build --release -p beacon-cli

      # Report-only for now; no --enforce.
      - name: Perf (report-only)
        shell: bash
        run: >-
          cargo perf run
          --beacon target/release/beacon${{ runner.os == 'Windows' && '.exe' || '' }}
          --project target/corpus-medium
          --runs 20
          --idle-secs 5
          --json perf-${{ runner.os }}.json

      - name: Spike
        run: cargo spike

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ runner.os }}
          path: |
            perf-*.json
            docs/spikes/quickjs.md
